[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-system"
version = "0.1.0"
description = "Hybrid Python/C++ quantitative trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "numpy>=2.0",
    "pandas>=2.2",
    "uvicorn>=0.53,<1",
    "yfinance>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
quant_system = ["web/*"]

[project.scripts]
quant-dashboard = "quant_system.dashboard:main"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
pythonpath = ["python"]
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python/quant_system"]
